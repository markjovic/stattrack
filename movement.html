<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Player Movement</title>
<!-- movement.html v1.0 — page only; data comes from movement/bv/*.json in sports-players-stats -->
<style>
:root{--bg:#0a0b0d;--card:#141619;--elevated:#1c1f24;--line:#262a30;--text:#f2f4f7;--text2:#9aa3ad;--text3:#5f6872;--accent:#00f5d4;--stay:#4caf50;--new:#2196f3;--left:#f44336}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--text2);font-size:.85rem;margin-bottom:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
label{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
select{background:var(--elevated);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:.95rem;font-weight:600;margin-left:6px}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 14px;flex:1;min-width:130px}
.stat .v{font-size:1.3rem;font-weight:800}
.stat .k{color:var(--text3);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
.note{background:rgba(0,245,212,.06);border:1px solid rgba(0,245,212,.18);border-radius:11px;padding:11px 14px;font-size:.84rem;color:var(--text2);margin-bottom:16px}
.note b{color:var(--text)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--text2);margin:4px 0 14px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
/* The diagram is ~1,950 x 18,000px inside an 82vh window, so the horizontal
   scrollbar sits thousands of pixels below the viewport and cannot be reached.
   Buttons, drag-pan and shift+wheel give it three ways to move that do not
   depend on finding a scrollbar. The season strip and the age-group gutter live
   OUTSIDE the scroller and are translated to match it, so they stay put without
   covering any of the diagram. */
.pver{display:block;font-size:0.62rem;color:var(--text3);letter-spacing:.04em;margin:-6px 0 4px}
.svgouter{position:relative}
.navbar{display:flex;align-items:center;gap:6px;padding:0 0 6px}
.nvb{width:30px;height:26px;border:1px solid var(--line);background:var(--card);color:var(--text2);
  border-radius:7px;cursor:pointer;font-size:14px;line-height:1;font-family:inherit}
.nvb.wide{width:auto;padding:0 10px;font-size:11.5px}
.zlab{font-size:11.5px;color:var(--text2);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.nvb:hover{color:var(--text);border-color:var(--text3)}
.nvb:disabled{opacity:.35;cursor:default}
.navhint{font-size:11px;color:var(--text3);margin-left:4px}
.colbar{height:24px;overflow:hidden;position:relative;margin-left:84px}
.bandbar{flex:0 0 84px;width:84px;overflow:hidden;position:relative}
.svgrow{display:flex;align-items:stretch;max-height:82vh}
.barin{position:absolute;left:0;top:0;will-change:transform}
.colbar .cb{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.colbar .cb.empty{color:#ef5350}
.bandbar .bb{position:absolute;left:0;width:84px;font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:.07em;color:var(--accent);padding-right:8px;text-align:right}
.svgwrap{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;overflow:auto;max-height:82vh}
.svgwrap.drag{cursor:grabbing}
.svgwrap{cursor:grab}
svg{display:block}
.colhdr{fill:var(--text2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tname{fill:var(--text);font-size:12.5px;font-weight:600}
.tmeta{fill:var(--text3);font-size:10.5px}
.ann{font-size:10px;font-weight:700}
.link{fill:none;opacity:.34;transition:opacity .12s;cursor:pointer}
.link.dim,.dlink.dim{opacity:.05}
.dlink{fill:none;opacity:.42;transition:opacity .12s;cursor:pointer}
.tnode,.dnode{cursor:pointer}
.tnode.dim,.dnode.dim{opacity:.22}
.tnode.on rect,.dnode.on rect{stroke:#fff;stroke-width:2.4}
.dname{font-size:12px;font-weight:700}
.dsep{stroke:var(--line);stroke-dasharray:3 4}
.dseplab{fill:var(--text3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rlab{font-size:10.5px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#0a0b0d;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.rlab.dim{opacity:.08}
.bandlab{fill:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.olink{fill:none;opacity:.95;pointer-events:none}
.olab{font-size:11px;font-weight:800;fill:#0a0b0d;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.plist{margin-top:14px}
.psum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.85rem;color:var(--text2);margin-bottom:10px}
.psum b{color:var(--text)}.psum .ln{margin:3px 0}
.ptab{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ptab th{text-align:left;color:var(--text3);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab tr{cursor:pointer}.ptab tr:hover td{background:var(--elevated)}.ptab tr.on td{background:rgba(0,245,212,.10)}
.ptab .code{font-family:ui-monospace,Consolas,monospace;color:var(--text2)}
.hint{color:var(--text3);font-size:.82rem;padding:10px 2px}
.ptwrap{overflow-x:auto}
.foot{color:var(--text3);font-size:.75rem;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1">Player movement</h1><span class="pver">v1.07</span>
  <div class="sub" id="sub"></div>

  <div class="controls">
    <label>Club<select id="coll"></select></label>
    <label>View<select id="mode">
      <option value="all">All teams</option>
      <option value="cohort" selected>Follow a playing group</option>
    </select></label>
    <span id="cohortCtl"><label>Season<select id="csid"></select></label>
      <label>Age group<select id="cband"></select></label></span>
    <span id="rangeCtl"><label>Age from<select id="lo"></select></label>
      <label>Age to<select id="hi"></select></label></span>
    <label>Layout<select id="lay">
      <option value="rev" selected>Newest left · oldest age top</option>
      <option value="fwd">Oldest left · youngest age top</option>
    </select></label>
    <label>Rows<select id="dens"><option value="7">Normal</option><option value="5">Compact</option><option value="10">Tall</option></select></label>
    <label title="Hide everything the selection does not touch and close the rest up"><input type="checkbox" id="focus" checked> Focus selection</label>
  </div>

  <div class="statrow" id="stats"></div>
  <div class="note" id="blurb"></div>
  <div class="sec">Longest-standing nuclei
    <select id="wt" style="font-size:.8rem;font-weight:600;text-transform:none;letter-spacing:0;padding:4px 8px">
      <option value="sqrt">seasons × √players</option>
      <option value="lin">seasons × players</option>
      <option value="sq">seasons² × players</option>
    </select>
  </div>
  <div id="nuc" style="margin-bottom:16px"></div>

  <div class="leg">
    <span><i class="sw" style="background:var(--stay)"></i> back = at this club last season</span>
    <span><i class="sw" style="background:var(--new)"></i> new = joined this season</span>
    <span><i class="sw" style="background:var(--left)"></i> left after = not on one of these teams next season</span>
  </div>
  <div class="leg" id="dleg"></div>

  <div class="svgouter">
    <div class="navbar">
      <button class="nvb" id="nvOut" title="Zoom out (ctrl+wheel down)">−</button>
      <span class="zlab" id="zlab">100%</span>
      <button class="nvb" id="nvIn" title="Zoom in (ctrl+wheel up)">+</button>
      <button class="nvb wide" id="nvFit" title="Shrink until the whole diagram fits the window">Fit to view</button>
      <button class="nvb wide" id="nvHome" title="Back to 100% at the top left (Home)">Reset</button>
      <button class="nvb wide" id="nvSel" title="Scroll to the selection">Find selection</button>
      <span class="navhint">drag to pan · shift+wheel sideways · ctrl+wheel zooms</span>
    </div>
    <div class="colbar"><div class="barin" id="colbarin"></div></div>
    <div class="svgrow">
      <div class="bandbar"><div class="barin" id="bandbarin"></div></div>
      <div class="svgwrap"><svg id="sk"></svg></div>
    </div>
  </div>
  <div class="plist" id="plist"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
// Data is fetched, not baked in: movement/bv/*.json in the data repo, listed by index.json.
// Both Pages sites are on markjovic.github.io, so this is same-origin.
const BASE=new URLSearchParams(location.search).get('base')||'https://markjovic.github.io/sports-players-stats';
const MDIR=BASE+'/movement/bv';
let DATA=null,SEAS=[],NS=0,SIX=[],BANDS=[],NODE={},INDEX=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORD=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const num=b=>+String(b).replace(/\D/g,'');
let TEN=null,TENI=0,EMPTY=new Set();

const DCOL={to:'#ce93d8',assoc:'#ffb74d',older:'#00f5d4',gap:'#b0bec5',none:'#ef5350',
            from:'#ce93d8',fromassoc:'#ffb74d',back:'#90caf9',new:'#2196f3'};
const DLAB={to:'Other club (named)',assoc:'Other association (named)',older:'Older age group, same club',
            gap:'Sat out, back later',none:'No later record',from:'From another club',
            fromassoc:'From another association',back:'Returning after a break',new:'New players'};
const kindOf=k=>k.slice(k.indexOf('|')+1).split(':')[0];
const nameOf=k=>{const t=k.slice(k.indexOf('|')+1);const i=t.indexOf(':');return i<0?'':t.slice(i+1);};
const boxLabel=k=>{const kd=kindOf(k),nm=nameOf(k);
  return kd==='to'?'→ '+nm:kd==='assoc'?'→ '+nm:kd==='from'?'From '+nm:kd==='fromassoc'?'From '+nm:(DLAB[kd]||kd);};
const boxShort=k=>{const l=boxLabel(k);return l.length>15?l.slice(0,14)+'…':l;};
const colOfBox=k=>+k.slice(1,k.indexOf('.'));
const bandOfBox=k=>k.slice(k.indexOf('.')+1,k.indexOf('|'));

let state={mode:'cohort',csid:0,cband:null,lo:null,hi:null,sel:null,unit:7,rev:true,wt:'sqrt',focus:true,zoom:1};
let GEOM={},LAID={},AXES=null;

/* ---------- sticky axes and panning ----------------------------------------
   The SVG is sized in px and sits in a scrolling box, so one SVG unit is one
   scrolled pixel; the bars only have to be translated by the same amount. The
   6px padding on .svgwrap is the offset between the two. */
const PAD=6;
/* Season labels shorten and shrink with the zoom. They are HTML, not SVG, so
   nothing scales them automatically — at 24% the columns are 60px apart while
   "SUMMER 2025/26" still wanted 150px, and the strip ran together into one
   unreadable line. Three forms, picked by what fits the column:
   full → "W 2026" / "S 25/26" → "26" / "25/26". */
function seasonShort(nm,lvl){
  if(lvl===0)return nm;
  const m=String(nm).match(/^(winter|summer|autumn|spring|term\s*\d*)\s*,?\s*(.+)$/i);
  const yr=m?m[2].trim():String(nm);
  if(lvl===2)return yr.replace(/^20/,'').replace(/\/20/,'/');
  const ini=m?m[1].trim()[0].toUpperCase():'';
  return (ini?ini+' ':'')+yr;
}
function drawAxes(){
  if(!AXES)return;
  const cb=document.getElementById('colbarin'),bb=document.getElementById('bandbarin');
  if(!cb||!bb)return;
  const z=AXES.z||1;
  const avail=Math.max(10,(AXES.step||200)*z-8);
  // Size follows the SPACE, not the zoom: full names stay 12px for as long as
  // they fit, then shrink, then give way to the shorter form. 0.62em a
  // character is close enough for this bold, letter-spaced face — the point
  // is to choose between three forms, not to typeset.
  let lvl=0,fs=12;
  for(lvl=0;lvl<3;lvl++){
    const widest=Math.max(...SEAS.map(nm=>seasonShort(nm,lvl).length));
    fs=Math.min(12,avail/(widest*0.62));
    if(fs>=9||lvl===2)break;
  }
  fs=Math.max(7,fs);
  cb.style.width=(AXES.W*z)+'px';
  cb.innerHTML=SEAS.map((nm,s)=>`<span class="cb${EMPTY.has(nm)?' empty':''}" title="${esc(nm)}" style="left:${AXES.colX[s]*z+PAD}px;top:4px;font-size:${fs.toFixed(1)}px">${esc(seasonShort(nm,lvl))}</span>`).join('');
  bb.style.height=(AXES.H*z)+'px';
  bb.innerHTML=AXES.bands.map(b=>`<span class="bb" title="${esc(b.label)}" style="top:${b.y*z+PAD+4}px;font-size:${fs.toFixed(1)}px">${esc(b.label)}</span>`).join('');
  syncAxes();
}
function syncAxes(){
  const w=document.querySelector('.svgwrap');if(!w||!AXES)return;
  const cb=document.getElementById('colbarin'),bb=document.getElementById('bandbarin');
  if(cb)cb.style.transform=`translateX(${-w.scrollLeft}px)`;
  if(bb)bb.style.transform=`translateY(${-w.scrollTop}px)`;
}
/* Buttons move by one column or one age group rather than a fixed pixel count,
   because the point of them is to land on the next thing, not to nudge. */
function panTo(x,y){
  const w=document.querySelector('.svgwrap');if(!w)return;
  w.scrollTo({left:Math.max(0,x),top:Math.max(0,y),behavior:'smooth'});
}
const ZMIN=0.08,ZMAX=1.5;
function setZoom(z,keepScroll){
  const v=Math.max(ZMIN,Math.min(ZMAX,+z||1));
  if(Math.abs(v-state.zoom)<0.001)return;
  state.zoom=v;
  render();
  if(!keepScroll)syncAxes();
}
function zoomLabel(){
  const l=document.getElementById('zlab');
  if(l)l.textContent=Math.round((state.zoom||1)*100)+'%';
}
/* Fit shrinks until the WHOLE diagram is inside the window — the one thing a
   1,950 x 18,000px panel cannot do at any preset, and the only way to see the
   shape of a career's worth of movement at once. */
function fitToView(){
  const w=document.querySelector('.svgwrap');if(!w||!AXES)return;
  const z=Math.min((w.clientWidth-2*PAD-4)/AXES.W,(w.clientHeight-2*PAD-4)/AXES.H);
  setZoom(z);
  panTo(0,0);
}
/* With a selection on screen, the one thing worth scrolling to is the thing
   that is selected — on an 18,000px panel it can be anywhere. */
function panToSelection(){
  const w=document.querySelector('.svgwrap');if(!w)return;
  const keys=Object.keys(LAID).filter(k=>{
    const e=document.querySelector(`#sk [data-k="${CSS.escape(k)}"]`);
    return e&&(e.classList.contains('on')||!e.classList.contains('dim'));});
  if(!keys.length)return;
  const z=(AXES&&AXES.z)||1;
  const ps=keys.map(k=>LAID[k]);
  const x=Math.min(...ps.map(p=>p.x))*z, y=Math.min(...ps.map(p=>p.y))*z;
  panTo(x+PAD-40,y+PAD-40);
}
function initPan(){
  const w=document.querySelector('.svgwrap');if(!w||w._pan)return;
  w._pan=1;
  w.addEventListener('scroll',syncAxes,{passive:true});
  // Shift+wheel is the usual sideways gesture and the box does not do it by
  // default when the content is taller than it is wide.
  w.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      setZoom(state.zoom*(e.deltaY<0?1.12:0.89));
      return;
    }
    if(!e.shiftKey)return;
    e.preventDefault(); w.scrollLeft+=(e.deltaY||e.deltaX);
  },{passive:false});
  let down=false,sx=0,sy=0,l0=0,t0=0,moved=0;
  w.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    down=true;moved=0;sx=e.clientX;sy=e.clientY;l0=w.scrollLeft;t0=w.scrollTop;
  });
  w.addEventListener('pointermove',e=>{
    if(!down)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<4)return;
    moved=1;w.classList.add('drag');w.setPointerCapture&&w.setPointerCapture(e.pointerId);
    w.scrollLeft=l0-dx;w.scrollTop=t0-dy;
  });
  const up=e=>{
    if(!down)return;
    down=false;w.classList.remove('drag');
    // A drag must not also count as a click on whatever was under the cursor.
    if(moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault();};
      w.addEventListener('click',stop,{capture:true,once:true});
      setTimeout(()=>w.removeEventListener('click',stop,{capture:true}),0);}
  };
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
  const B=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn;};
  B('nvOut',()=>setZoom(state.zoom*0.8));
  B('nvIn',()=>setZoom(state.zoom*1.25));
  B('nvFit',fitToView);
  B('nvHome',()=>{setZoom(1);panTo(0,0);});
  B('nvSel',panToSelection);
  window.addEventListener('keydown',e=>{
    if(/^(INPUT|SELECT|TEXTAREA)$/.test((e.target||{}).tagName||''))return;
    if(e.key==='Home'){setZoom(1);panTo(0,0);e.preventDefault();}
    else if(e.key==='-'||e.key==='_'){setZoom(state.zoom*0.8);e.preventDefault();}
    else if(e.key==='='||e.key==='+'){setZoom(state.zoom*1.25);e.preventDefault();}
    else if(e.key==='0'){fitToView();e.preventDefault();}
  });
  zoomLabel();
}

const bandsIn=sid=>[...new Set(DATA.nodes.filter(n=>n.sid===sid).map(n=>n.band))].sort((a,b)=>num(a)-num(b));
function syncCohortBands(){
  const sel=document.getElementById('cband'),bs=bandsIn(state.csid);
  if(!bs.includes(state.cband))state.cband=bs.includes('U13')?'U13':bs[bs.length-1];
  sel.innerHTML=bs.map(x=>`<option value="${x}"${x===state.cband?' selected':''}>${x}</option>`).join('');
}
function initControls(){
  const lo=document.getElementById('lo'),hi=document.getElementById('hi');
  const opts=b=>BANDS.map(x=>`<option value="${x}"${x===b?' selected':''}>${x}</option>`).join('');
  lo.innerHTML=opts(state.lo); hi.innerHTML=opts(state.hi);
  lo.onchange=()=>{state.lo=lo.value;if(num(state.lo)>num(state.hi)){state.hi=state.lo;hi.value=state.hi;}state.sel=null;render();};
  hi.onchange=()=>{state.hi=hi.value;if(num(state.hi)<num(state.lo)){state.lo=state.hi;lo.value=state.lo;}state.sel=null;render();};
  const csid=document.getElementById('csid');
  csid.innerHTML=SEAS.map((n,i)=>`<option value="${i}"${i===state.csid?' selected':''}>${esc(n)}</option>`).join('');
  csid.onchange=()=>{state.csid=+csid.value;syncCohortBands();state.sel=null;render();};
  syncCohortBands();
  document.getElementById('cband').onchange=e=>{state.cband=e.target.value;state.sel=null;render();};
  const mode=document.getElementById('mode');
  mode.value=state.mode;
  mode.onchange=()=>{state.mode=mode.value;state.sel=null;applyMode();render();};
  applyMode();
  document.getElementById('dens').onchange=e=>{state.unit=+e.target.value;render();};
  document.getElementById('focus').onchange=e=>{state.focus=e.target.checked;render();};

  const lay=document.getElementById('lay');
  lay.value=state.rev?'rev':'fwd';
  lay.onchange=()=>{state.rev=lay.value==='rev';render();};
  const wt=document.getElementById('wt');
  wt.value=state.wt;
  wt.onchange=()=>{state.wt=wt.value;render();};
  document.getElementById('h1').textContent=`${DATA.club} — player movement`;
  document.title=`${DATA.club} — player movement`;
  setSub();
  document.getElementById('dleg').innerHTML='<span style="color:var(--text3)">boxes →</span>'+
    Object.keys(DLAB).map(k=>`<span><i class="sw" style="background:${DCOL[k]}"></i>${esc(DLAB[k])}</span>`).join('');
  document.getElementById('foot').innerHTML=
    `Teams within an age group are ordered by grade, strongest at the top, then by ladder position (shown bottom-right, e.g. <b>A · 3rd</b>). `+
    `Ribbon thickness is a fixed width per player, the same everywhere on the page, so thickness is directly comparable between any two ribbons. `+
    `Ladder position is derived from each team's own completed fixtures: 2 points a win, 1 a draw, ties split on points difference. `+
    `A season still in progress shows "now 3rd" rather than a finishing position, and a grade with no completed game gets none at all. `+
    `Hovering a team also shows how long its players have been together, as an unbroken run: "6 for 3 seasons · 3 for 7 seasons" means six of them have been `+
    `on one team for the last three seasons, and three of those six for the last seven. A season apart ends the run. `+
    `A player holds ONE position per season — the team in their own (youngest) age group. Playing up is common: where a player also turned out for an older `+
    `age group, that older team shows them as "+N played up" rather than as a second position, so each player leaves and enters exactly one team per `+
    `season and the ribbon counts reconcile. A team carrying two grades in one season is a regrade and counts once. `+
    `Boxes under <b>Left after …</b> name where leavers went next season; boxes under <b>Joined for …</b> name where arrivals came from. `+
    `On the last season, each team shows how many of its players are in their FIRST season in that age group and how many have been there before — `+
    `measured, not predicted: band tenure across this competition is bimodal, so "second season means moving up" is close to a coin flip. `+
    `Built ${esc((DATA.stats||{}).builtAt||'')}.`;
}

function applyMode(){
  document.getElementById('cohortCtl').style.display=state.mode==='cohort'?'':'none';
  document.getElementById('rangeCtl').style.display=state.mode==='cohort'?'none':'';
}

const STATUS=i=>((DATA&&DATA.seasonStatus)||[])[i]||null;

// How long this team's players have been together, as an unbroken run. Walk back a season at a

// split in between, and calling that "together 7 seasons" claims a run nobody checked.
let TOGC=new Map();

  if(TOGC.has(key))return TOGC.get(key);

  if(n&&n.sid){
    let group=(COHORT?COHORT.players:PL).filter(p=>nodeBySid(p).get(n.sid)===key);
    if(group.length>=2){
      for(let s=n.sid-1;s>=0;s--){
        const b=new Map();
        group.forEach(p=>{const k=nodeBySid(p).get(s);if(k){let t=b.get(k);if(!t){t=[];b.set(k,t);}t.push(p);}});
        let best=[];for(const v of b.values())if(v.length>best.length)best=v;
        if(best.length<2)break;

        if(prev&&prev.k===best.length)prev.s=seasons;

          const nm=best.map(who);

function togetherFor(key){

// ---------- nucleus: squads that stayed together disproportionately long ----------

  // arbitrary exponent, and the largest-scale formula would dominate any average — but to show
  // which results survive the choice of formula and which only exist because of it.
  const KEYS=Object.keys(WEIGHTS);

  const avgRun=rows.length?rows.reduce((a,r)=>a+r.s,0)/rows.length:0;

    paths+=`<path class="${cls}"${faint} data-la="${esc(ka)}" data-lb="${esc(kb)}" d="${d}" stroke="${col}" stroke-width="${wdt}"><title>${esc(title)}</title></path>`;
    rl.push({x:REV?x2+5:x2-5,y:y2,n,la:ka,lb:kb,d,w:wdt,anc:REV?'start':'end'});});
  const byT={};rl.forEach(r=>(byT[r.lb]=byT[r.lb]||[]).push(r));
  Object.values(byT).forEach(a=>{a.sort((p,q)=>p.y-q.y);for(let i=1;i<a.length;i++)if(a[i].y<a[i-1].y+11)a[i].y=a[i-1].y+11;});
  const labs=rl.map(r=>`<text class="rlab" data-la="${esc(r.la)}" data-lb="${esc(r.lb)}" x="${r.x}" y="${r.y+3.5}" text-anchor="${r.anc}">${r.n}</text>`).join('');

  let bg=bands.map(b=>`<rect x="4" y="${b.y}" width="${W-8}" height="${b.h}" rx="10" fill="rgba(0,245,212,.025)" stroke="rgba(255,255,255,.06)"></rect>`+
    '').join('');
  let hdr=SEAS.map((nm,s)=>EMPTY.has(nm)
    ?`<text class="colsub" x="${colX[s]}" y="38" text-anchor="middle" style="fill:#ef5350;font-size:10.5px">no registrations recorded</text>`:'').join('');
  seps.forEach(p=>{hdr+=`<line class="dsep" x1="${p.x-10}" x2="${p.x+nodeW+10}" y1="${p.y}" y2="${p.y}"></line>`+
    `<text class="dseplab" x="${p.x}" y="${p.y+15}">${esc(p.t)}</text>`;});

  let nodes='';
  Object.entries(LAID).forEach(([k,p])=>{
    if(p.box){const col=DCOL[kindOf(p.box)]||'#888';const dash=kindOf(p.box)==='none'?' stroke-dasharray="4 3"':'';
      nodes+=`<g class="dnode" data-k="${esc(k)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="5" fill="${col}22" stroke="${col}" stroke-width="1.4"${dash}></rect>`+
        `<text class="dname" fill="${col}" x="${p.x+8}" y="${p.y+15}">${esc(boxShort(p.box))}</text>`+
        `<text class="tmeta" x="${p.x+p.w-8}" y="${p.y+15}" text-anchor="end" style="fill:${col};font-weight:800">${p.cnt}</text>`+
        `<title>${esc(boxLabel(p.box)+': '+p.cnt+(nameList(NMAP.node.get(p.box))?'\n'+nameList(NMAP.node.get(p.box)):''))}</title></g>`;return;}
    const n=p.n,s=n.sid,col='#7fd8ff';
    const back=s>0?(inW[k]||0):0,nw=s>0?n.n-back:0,left=s<NS-1?n.n-(outW[k]||0):0;
    const inT=[];if(back)inT.push(`<tspan fill="var(--stay)">${back} back</tspan>`);if(nw)inT.push(`<tspan fill="var(--new)">+${nw} new</tspan>`);
    const gradeRaw=n.g?(String(n.g).replace(/^.*?\bU\s?\d{1,2}\b\s*/i,'').replace(/\b(boys?|girls?|mixed)\b/ig,'').trim()||n.g):'';
    const gradeCut=gradeRaw.length>12?gradeRaw.slice(0,11)+'…':gradeRaw;
    const posTxt=n.gp?(DONE(n.sid)?' · '+ORD(n.gp):' · now '+ORD(n.gp)):'';
    const gradeTxt=gradeRaw?`${esc(gradeCut)}${posTxt}`:'';
    const ten=n.tenure?`${n.tenure.first} 1st yr · ${n.tenure.repeat} returning`:'';
    const posWord=n.gp?(DONE(n.sid)?`finished ${ORD(n.gp)}`:`${ORD(n.gp)} on the ladder so far`)
                      :(n.g?'no ladder yet — no completed games':'');
    const tip=[`${esc(n.team)} · ${esc(SEAS[n.sid])}`,
               `${n.band} · ${esc(n.g||'')}${posWord?' · '+posWord:''}`,
               `${n.n} players`];
    const tog=togetherFor(k);
    if(tog)tip.push(`together: ${tog}`);
    if(n.alsoN)tip.push(`${n.alsoN} more played up into this team while counted in their own age group`);
    if(ten)tip.push(`in ${SEAS[NS-1]}: ${ten}`);
    const who_=nameList(NMAP.node.get(k));
    if(who_)tip.push(who_);
    nodes+=`<g class="tnode" data-k="${esc(k)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="5" fill="${col}22" stroke="${col}" stroke-width="1.4"></rect>`+
      `<text class="tname" x="${p.x+8}" y="${p.y+15}">${esc(n.team)}</text><text class="tmeta" x="${p.x+p.w-8}" y="${p.y+15}" text-anchor="end">${n.n}</text>`+
      (inT.length?`<text class="ann" x="${p.x+8}" y="${p.y+29}">${inT.join('<tspan>  </tspan>')}</text>`:'')+
      (left?`<text class="ann" x="${p.x+8}" y="${p.y+p.h-7}"><tspan fill="var(--left)">${left} left</tspan></text>`:'')+
      (gradeTxt?`<text class="tmeta" x="${p.x+p.w-8}" y="${p.y+p.h-7}" text-anchor="end">${gradeTxt}</text>`:'')+
      `<title>${esc(tip.join('\n'))}</title></g>`;});

  svg.innerHTML=bg+hdr+paths+nodes+labs;
  GEOM={};rl.forEach(r=>GEOM[r.la+'>'+r.lb]=r);
  svg.querySelectorAll('.tnode,.dnode').forEach(g=>{g.onclick=()=>select({type:'node',k:g.dataset.k});});
  svg.querySelectorAll('.link,.dlink').forEach(l=>{l.onclick=()=>select({type:'link',k:l.dataset.la+'>'+l.dataset.lb});});
  drawAxes();
  zoomLabel();
  applySelection();
}

// ---------- players: pseudonymous codes only ----------
let PL=[];
function playersFor(sel){
  if(!sel)return [];
  const POOL=COHORT?COHORT.players:PL;
  if(sel.type==='player')return POOL.filter(p=>p.c===sel.k);
  if(sel.type==='link'){const [a,b]=sel.k.split('>');return POOL.filter(p=>p.h.some(h=>h[0]===a&&h[1]===b));}
  const k=sel.k;
  if(k[0]==='D')return POOL.filter(p=>p.h.some(h=>h[1]===k));
  if(k[0]==='S')return POOL.filter(p=>p.h.some(h=>h[0]===k));
  const n=NODE[k];if(!n)return [];
  return POOL.filter(p=>p.s[n.sid]&&p.s[n.sid].t===n.team);
}
function select(sel){
  const same=state.sel&&sel&&state.sel.type===sel.type&&state.sel.k===sel.k;
  state.sel=same?null:sel;
  // Focus changes WHAT is drawn, not only how it looks, so it needs a render.
  if(state.focus)render(); else applySelection();
}
function cellHtml(c){
  if(!c)return '<span style="color:var(--text3)">–</span>';
  if(c.t)return `<b>${esc(c.t)}</b> <span class="tmeta">${esc(c.b)}</span>`+(c.also?` <span class="tmeta">also ${esc(c.also)}</span>`:'');
  if(c.k==='to')return `<span style="color:${DCOL.to}">${esc(c.l)}</span>`;
  if(c.k==='assoc')return `<span style="color:${DCOL.assoc}">${esc(c.l)}</span>`;
  return `<span style="color:${DCOL.gap}">not in this competition</span>`;
}
function tallyLine(list,s){
  const t={};list.forEach(p=>{const c=p.s[s];
    const k=!c?'not yet here':c.t?c.t:c.k==='to'?c.l:c.k==='assoc'?c.l:'not in this competition';
    t[k]=(t[k]||0)+1;});
  return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`${esc(k)} <b>${n}</b>`).join(' · ');
}
function applySelection(){
  const svg=document.getElementById('sk'),sel=state.sel,box=document.getElementById('plist');
  svg.querySelectorAll('.olink,.olab').forEach(e=>e.remove());
  svg.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  const list=playersFor(sel);
  if(!sel){svg.querySelectorAll('.link,.dlink,.rlab,.tnode,.dnode').forEach(e=>e.classList.remove('dim'));
    box.innerHTML=`<div class="hint">Click a team, a ribbon or a box to trace those players across every season and list them. Players appear as codes (P001…) — no names are recorded.</div>`;return;}
  const agg={},touched=new Set();
  list.forEach(p=>{p.h.forEach(h=>{const k=h[0]+'>'+h[1];if(GEOM[k]){agg[k]=(agg[k]||0)+1;touched.add(h[0]);touched.add(h[1]);}});});
  svg.querySelectorAll('.link,.dlink,.rlab').forEach(e=>e.classList.add('dim'));
  svg.querySelectorAll('.tnode,.dnode').forEach(n=>n.classList.toggle('dim',!touched.has(n.dataset.k)));
  if(sel.type==='node'){const n=svg.querySelector(`[data-k="${CSS.escape(sel.k)}"]`);if(n)n.classList.add('on');}
  /* HOME is what was actually picked: the team, both ends of a picked ribbon,
     or — for a player — the last team they are recorded in, which is the "current
     team" in their history. Ribbons with an end there are this selection's OWN
     links and get the accent; everything else in the traced path keeps the white
     overlay (or its box colour). Without the split, a 10-season trace is one
     undifferentiated web and the thing you clicked is lost in it. */
  const HOME=new Set();
  if(sel.type==='node')HOME.add(sel.k);
  else if(sel.type==='link')sel.k.split('>').forEach(k=>HOME.add(k));
  else if(sel.type==='player'){
    const sidOf=k=>(k&&k[0]==='N')?(+k.slice(1,k.indexOf('.'))||0):-1;
    let best=null,bs=-1;
    list.forEach(p=>p.h.forEach(h=>h.forEach(k=>{const s=sidOf(k);if(s>bs){bs=s;best=k;}})));
    if(best)HOME.add(best);
  }
  const HOMECOL='#00f5d4';
  const ns='http://www.w3.org/2000/svg';
  Object.entries(agg).forEach(([k,n])=>{const g=GEOM[k];if(!g)return;const ends=k.split('>');
    const home=ends.some(e=>HOME.has(e));
    const bx=ends.find(e=>e[0]==='D'||e[0]==='S');
    const col=home?HOMECOL:(bx?(DCOL[kindOf(bx)]||'#fff'):'#ffffff');
    const pth=document.createElementNS(ns,'path');pth.setAttribute('class','olink');pth.setAttribute('d',g.d);
    pth.setAttribute('stroke',col);pth.setAttribute('stroke-width',Math.max(home?3.2:2.5,n/g.n*g.w));
    if(home)pth.setAttribute('opacity','1');svg.appendChild(pth);
    const t=document.createElementNS(ns,'text');t.setAttribute('class','olab');t.setAttribute('x',g.x);t.setAttribute('y',g.y+3.5);
    t.setAttribute('text-anchor',g.anc||'end');t.textContent=n;svg.appendChild(t);});
  const keyLab=k=>(k[0]==='D'||k[0]==='S')?boxLabel(k):(NODE[k]?`${NODE[k].team} (${SEAS[NODE[k].sid]})`:k);
  let title;
  if(sel.type==='player')title=`Player <b>${esc(sel.k)}</b>`;
  else if(sel.type==='link'){const [a,b]=sel.k.split('>');title=`<b>${esc(keyLab(a))}</b> → <b>${esc(keyLab(b))}</b>`;}
  else title=`<b>${esc(keyLab(sel.k))}</b>`;
  const homeLab=sel.type==='player'?'this player\u2019s latest team':sel.type==='link'?'the ribbon you picked':'the team you picked';
  let h=`<div class="psum"><div class="ln">${title} \u2014 <b>${list.length}</b> player${list.length===1?'':'s'}</div>`;
  if(HOME.size)h+=`<div class="ln" style="font-size:11px;color:var(--text3)"><i class="sw" style="background:${HOMECOL};display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px"></i>links straight into or out of ${esc(homeLab)} \u00b7 <i class="sw" style="background:#fff;display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 5px 0 8px"></i>where these players went before and after</div>`;
  if(DATA.withNames&&list.length){
    // One name per person. Two records for one child are two rows in the table below, where their
    // differing histories are visible; listing the name twice here just reads as a mistake.
    const names=[...new Set(list.map(who))].sort((a,b)=>String(a).localeCompare(String(b)));
    h+=`<div class="ln" style="color:var(--text)">${esc(names.join(', '))}</div>`;
  }
  if(sel.type==='node'&&NODE[sel.k]){
    const n=NODE[sel.k];
    const pw=n.gp?(DONE(n.sid)?`finished ${ORD(n.gp)}`:`${ORD(n.gp)} on the ladder so far`):'no ladder yet';
    h+=`<div class="ln"><span style="color:var(--text3)">${esc(SEAS[n.sid])} · ${esc(n.g||'')}:</span> ${esc(pw)}</div>`;
    const tog=togetherFor(sel.k);
    if(tog)h+=`<div class="ln"><span style="color:var(--text3)">Played together:</span> ${esc(tog)}</div>`;
  }
  if(list.length>1)SIX.forEach(s=>{h+=`<div class="ln"><span style="color:var(--text3)">${esc(SEAS[s])}:</span> ${tallyLine(list,s)}</div>`;});
  h+=`</div>`;
  const ord=[...list].sort((a,b)=>{for(const s of SIX){const x=JSON.stringify(a.s[s]||''),y=JSON.stringify(b.s[s]||'');if(x!==y)return x<y?-1:1;}return a.c<b.c?-1:1;});
  h+=`<div class="ptwrap"><table class="ptab"><tr><th>Player</th>${SEAS.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>`+
     ord.map(p=>`<tr data-c="${p.c}"${sel.type==='player'?' class="on"':''}><td class="code">${esc(DATA.withNames?who(p):p.c)}</td>`+
     p.s.map(c=>`<td>${cellHtml(c)}</td>`).join('')+`</tr>`).join('')+`</table></div>`;
  box.innerHTML=h;
  box.querySelectorAll('tr[data-c]').forEach(tr=>{tr.onclick=()=>{
    if(state.sel&&state.sel.type==='player'&&state.sel.k===tr.dataset.c){state.sel=state._prev||null;state._prev=null;}
    else{state._prev=state.sel&&state.sel.type!=='player'?state.sel:state._prev;state.sel={type:'player',k:tr.dataset.c};}
    applySelection();};});
}
// ---------- loading ----------
const $=id=>document.getElementById(id);
function say(msg,bad){$('plist').innerHTML=`<div class="hint"${bad?' style="color:#ef5350"':''}>${esc(msg)}</div>`;}
async function gj(url){
  const r=await fetch(url,{cache:'no-cache'});
  if(!r.ok)throw new Error(`${r.status} ${r.statusText} — ${url}`);
  return r.json();
}
function adopt(d){
  DATA=d; SEAS=DATA.seasons; NS=SEAS.length; SIX=SEAS.map((_,i)=>i);
  BANDS=DATA.bands.slice(); NODE={}; DATA.nodes.forEach(n=>NODE[n.key]=n);
  TEN=DATA.tenureSeason||SEAS[NS-1]; TENI=Math.max(0,SEAS.indexOf(TEN));
  EMPTY=new Set(DATA.emptySeasons||[]); PL=DATA.players||[];
  LINKS_BY_B=null; COHORT=null;
  state.csid=TENI; state.cband=null; state.lo=BANDS[0]; state.hi=BANDS[BANDS.length-1]; state.sel=null;
}
async function loadCollection(file){
  say('Loading '+file+' …');
  try{ adopt(await gj(MDIR+'/'+file)); }
  catch(e){ say('Could not load '+file+' — '+e.message+'. The collection may not have been built yet.',true); return; }
  initControls(); render(); initPan();
}
async function boot(){
  try{ INDEX=await gj(MDIR+'/index.json'); }
  catch(e){
    say('Could not load the collection list from '+MDIR+'/index.json — '+e.message+
        '. Run Build Club Movement for at least one club, then Deploy Pages.',true); return;
  }
  INDEX=(INDEX.collections||INDEX).slice().sort((a,b)=>
    String(a.club).localeCompare(String(b.club))||String(a.gender).localeCompare(String(b.gender)));
  if(!INDEX.length){say('The collection list is empty — no club has been built yet.',true);return;}
  const sel=$('coll');
  sel.innerHTML=INDEX.map((c,i)=>`<option value="${i}">${esc(c.club)} · ${esc(c.gender)}${c.org?' · '+esc(c.org):''}</option>`).join('');
  sel.onchange=()=>loadCollection(INDEX[+sel.value].file);
  const want=new URLSearchParams(location.search).get('c');
  const start=Math.max(0,INDEX.findIndex(c=>c.file===want));
  sel.value=start;
  await loadCollection(INDEX[start].file);
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);if(DATA)rt=setTimeout(render,150);});
boot();
</script>
